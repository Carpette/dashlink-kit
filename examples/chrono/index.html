<!--
  Chrono de balade, exemple de cockpit en module pour DashLink.
  Affichage seulement : aucun script ici (il ne s'exécuterait pas). La logique est dans chrono.js, qui met à jour
  les éléments par leur id et reçoit les appuis sur les éléments marqués data-tap.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  #c { height: 100%; display: flex; flex-direction: column; padding: 10px; gap: 10px; background: #07090c; color: #fff; font-family: system-ui, sans-serif; }
  #time { flex: 1.3; display: flex; align-items: center; justify-content: center; font-size: 26vw; font-weight: 800;
          font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
  #info { display: flex; justify-content: space-around; font-size: 6vw; color: #9aa4ae; }
  #info b { color: #fff; font-size: 9vw; display: block; text-align: center; }
  .row { flex: 1; display: flex; gap: 10px; }
  button { flex: 1; border: 0; border-radius: 24px; font-size: 8vw; font-weight: 800; color: #000; font-family: inherit; }
  #go { background: #3ddc84; } #go.run { background: #ff5252; color: #fff; }
  #lap { background: #ffd400; } #reset { background: #262c33; color: #fff; }
  #laps { font-size: 5vw; color: #9aa4ae; text-align: center; min-height: 1.4em; }
</style>
<div id="c">
  <div id="time">0:00</div>
  <div id="info">
    <div>vitesse<b id="speed">--</b></div>
    <div>vmax<b id="vmax">--</b></div>
    <div>moyenne<b id="avg">--</b></div>
  </div>
  <div id="laps"></div>
  <div class="row"><button id="go" data-tap="go">Départ</button></div>
  <div class="row"><button id="lap" data-tap="lap">Tour</button><button id="reset" data-tap="reset">Zéro</button></div>
</div>
