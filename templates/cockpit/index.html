<!--
  Affichage du cockpit : HTML et CSS seulement. Aucun script ici, il ne s'exécuterait pas.
  logique.js change les éléments par leur id ; un appui sur un élément marqué data-tap lui est envoyé.
-->
<style>
  * { box-sizing: border-box; margin: 0; }
  #ecran { height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 12px; background: #000; color: #fff; font-family: system-ui, sans-serif; }
  #vitesse { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 40vw; font-weight: 800; font-variant-numeric: tabular-nums; }
  #unite { text-align: center; font-size: 6vw; color: #9aa4ae; }
  button { flex: 0 0 22%; border: 0; border-radius: 24px; font-size: 9vw; font-weight: 800; background: #ffd400; color: #000; font-family: inherit; }
  button.max { background: #3ddc84; }
</style>
<div id="ecran">
  <div id="vitesse">--</div>
  <div id="unite">km/h</div>
  <button id="bouton" data-tap="max">Vitesse max</button>
</div>
